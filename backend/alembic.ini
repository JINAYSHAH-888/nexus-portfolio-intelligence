[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is intentionally NOT set here -- env.py pulls it from
# settings.sync_database_url so there is exactly ONE source of truth for the
# DSN, and no credentials live in a committed file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
