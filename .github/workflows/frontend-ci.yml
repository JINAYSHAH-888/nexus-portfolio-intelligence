name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["frontend/**", "backend/backend/data/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend/**", "backend/backend/data/**", ".github/workflows/frontend-ci.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Verified landing facts still match the factsheet data
        # Re-derives every landing-page statistic from backend holdings with the
        # overlap engine's own rules; exits non-zero if any figure drifted.
        run: node scripts/build-overlap-dataset.mjs

      - name: Colour tokens pass WCAG AA in both themes
        run: node scripts/build-tokens.mjs

      - name: Generated files are committed and current
        run: git diff --exit-code -- lib/generated public/data styles/tokens

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
