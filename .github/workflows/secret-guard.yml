name: Secret guard

on: [push, pull_request]

jobs:
  no-env-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No .env files committed
        # backend/.env holds live broker and data-provider keys. Only
        # .env.example templates may ever be tracked.
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::A .env file is committed. Remove it and rotate every key in it."
            exit 1
          fi
          echo "OK: no secret env files tracked."
